<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aral Sulfur v__VERSION__</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,__ICON__">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy,flash_on&display=block" />
    <style>/* CSS_PLACEHOLDER */</style>
</head>

<body>
    <div class="bg-checker"></div>
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>
    <div class="bg-beam" style="top:-70vmax;left:-20vmax"></div>

    <div class="header">
        <img id="header-logo" src="data:image/x-icon;base64,__ICON__" alt="Aral Sulfur Logo" width="48" height="48">
        <h1 class="glitch" data-text="Aral Sulfur">Aral <b>Sulfur</b></h1>
        <span class="panel-version">
            v__VERSION__
        </span>
        <label class="theme-toggle" id="themeToggle" title="Dark / Light">
            <input type="checkbox" id="themeSwitch" aria-label="Toggle dark-light theme">
            <i>☀</i>
        </label>
    </div>

    <div class="table-wrapper">
        <table id="geo-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Proxy IP</th>
                    <th>Health rate</th>
                    <th>TCP Latency (ms)</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>ISP</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer class="aral-footer">
        <div class="aral-brand" data-text="ARAL SULFUR">ARAL SULFUR</div>
        <div class="aral-links">
            <a href="https://t.me/AralDev" target="_blank" rel="noopener noreferrer">t.me/AralDev</a>
            <a href="https://t.me/AralPanel" target="_blank" rel="noopener noreferrer">t.me/AralPanel</a>
            <a href="https://youtube.com/@Aral-Dev" target="_blank" rel="noopener noreferrer">@Aral-Dev</a>
            <a href="https://github.com/Aral-Dev/Aral-Sulfur" target="_blank" rel="noopener noreferrer">Aral-Dev</a>
        </div>
    </footer>

    <script type="module">
        import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
        polyfillCountryFlagEmojis();
    </script>
    <script>/* JS_PLACEHOLDER */</script>
</body>

</html>
